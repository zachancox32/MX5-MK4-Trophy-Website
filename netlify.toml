# 11ty build. Netlify installs from package.json and runs this.
[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  # 22 is Netlify's current default LTS and is definitely present in their
  # build image. 24 may not be, and an unresolvable version fails the build
  # before it reaches the first command.
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
